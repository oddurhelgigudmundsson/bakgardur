<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{--bg:#0d1117;--sf:#161b22;--card:#1f2937;--br:rgba(255,255,255,0.07);--tx:#e6edf3;--dm:#8b949e;--bl:#58a6ff;--gr:#3fb950;--or:#f97316;--rd:#f85149;--gd:#e3b341;--pu:#a371f7;--ra:10px;--gap:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100%}
.sidenav{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--sf);border-right:1px solid var(--br);overflow-y:auto;z-index:200;padding-bottom:24px}
.nl{padding:20px 20px 16px;border-bottom:1px solid var(--br)}
.nl h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;line-height:1.3}
.nl p{font-size:11px;color:var(--dm);margin-top:2px}
.ns{padding:10px 12px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dm)}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:transparent;color:var(--dm);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;text-align:left;transition:all .12s}
.nb:hover{background:rgba(255,255,255,0.04);color:var(--tx)}
.nb.active{background:rgba(88,166,255,0.12);color:var(--bl)}
.nb .dot{width:7px;height:7px;border-radius:50%;background:var(--br);flex-shrink:0}
.nb.active .dot{background:var(--bl)}
.stag{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto}
.mai{background:rgba(249,115,22,.15);color:var(--or)}
.sept{background:rgba(88,166,255,.15);color:var(--bl)}
.main{margin-left:220px;padding:24px;min-height:100vh}
.panel{display:none}.panel.active{display:block}
.hero{margin-bottom:20px}
.htitle{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1.1;margin-bottom:3px}
.hsub{color:var(--dm);font-size:13px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:1px;background:var(--br);border:1px solid var(--br);border-radius:var(--ra);overflow:hidden;margin:14px 0 20px}
.sb{background:var(--sf);padding:13px 15px}
.sv{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;line-height:1;margin-bottom:2px}
.sl{font-size:11px;color:var(--dm)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.card{background:var(--card);border:1px solid var(--br);border-radius:var(--ra);padding:18px;margin-bottom:var(--gap)}
.card:last-child{margin-bottom:0}
.ct{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dm);margin-bottom:14px}
.cw{position:relative}.h180{height:180px}.h220{height:220px}.h260{height:260px}.h300{height:300px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dm);padding:6px 8px;border-bottom:1px solid var(--br);text-align:left}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--br);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,0.02)}
.rk{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.r1{background:#FFD700;color:#000}.r2{background:#C0C0C0;color:#000}.r3{background:#CD7F32;color:#fff}.rn{background:var(--br);color:var(--dm)}
.bm{background:rgba(88,166,255,.15);color:var(--bl);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.bf{background:rgba(248,81,73,.15);color:var(--rd);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.nm{font-weight:500;color:var(--tx)}.sub{font-size:11px;color:var(--dm)}
.vlg{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.gbar{height:10px;border-radius:5px;display:flex;overflow:hidden;margin:8px 0 4px}
.gbm{background:var(--bl)}.gbf{background:var(--rd)}
.gleg{display:flex;gap:14px;margin-top:5px}
.gleg span{font-size:11px;color:var(--dm);display:flex;align-items:center;gap:5px}
.gdot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* winner cards */
.wcard{border-radius:var(--ra);padding:14px 18px;display:flex;align-items:center;gap:14px;border:1px solid}
.wcard.gold{background:linear-gradient(135deg,rgba(227,179,65,.1),rgba(227,179,65,.02));border-color:rgba(227,179,65,.25)}
.wcard.silver{background:linear-gradient(135deg,rgba(192,192,192,.08),rgba(192,192,192,.02));border-color:rgba(192,192,192,.2)}
.wicon{font-size:26px;flex-shrink:0}
.wlbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wlbl.gold{color:var(--gd)}.wlbl.silver{color:#aaa}
.wnm{font-size:17px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1.2}
.wsub{font-size:11px;color:var(--dm);margin-top:2px}
.wlaps{margin-left:auto;text-align:right;flex-shrink:0}
.wnum{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;line-height:1}
.wnum.gold{color:var(--gd)}.wnum.silver{color:#bbb}
.wunit{font-size:11px;color:var(--dm)}
/* tabs */
.ptabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--br)}
.ptab{padding:7px 14px;border:none;background:transparent;color:var(--dm);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.active{color:var(--bl);border-bottom-color:var(--bl)}
.ptp{display:none}.ptp.active{display:block}
@media(max-width:768px){.sidenav{width:100%;position:relative}.main{margin-left:0}.g2,.g3{grid-template-columns:1fr}}
</style>

// Chart helpers
const CG={grid:'rgba(255,255,255,0.05)',tx:'#8b949e',bl:'#58a6ff',gr:'#3fb950',or:'#f97316',rd:'#f85149',gd:'#e3b341',pu:'#a371f7'};
const CO={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1f2937',titleColor:'#e6edf3',bodyColor:'#8b949e',borderColor:'rgba(255,255,255,0.08)',borderWidth:1,padding:10}},scales:{x:{grid:{color:CG.grid},ticks:{color:CG.tx,font:{size:10}}},y:{grid:{color:CG.grid},ticks:{color:CG.tx,font:{size:10}}}}};
const CC={};
function mkC(id,type,data,extra={}){
  const c=document.getElementById(id);
  if(!c||CC[id])return;
  const opt=JSON.parse(JSON.stringify(CO));
  Object.assign(opt,extra);
  if(extra.plugins) Object.assign(opt.plugins,extra.plugins);
  if(extra.scales) Object.assign(opt.scales,extra.scales);
  CC[id]=new Chart(c,{type,data,options:opt});
}
function mkDonut(id,m,f){
  const c=document.getElementById(id);if(!c||CC[id])return;
  CC[id]=new Chart(c,{type:'doughnut',data:{labels:['Karlar','Konur'],datasets:[{data:[m,f],backgroundColor:[CG.bl,CG.rd],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:true,position:'right',labels:{color:'#8b949e',font:{size:11},padding:10}},tooltip:{backgroundColor:'#1f2937',titleColor:'#e6edf3',bodyColor:'#8b949e'}}}});
}

// UI helpers
function rb(i){if(i===0)return'<span class="rk r1">1</span>';if(i===1)return'<span class="rk r2">2</span>';if(i===2)return'<span class="rk r3">3</span>';return`<span class="rk rn">${i+1}</span>`;}
function gb(g){return g==='M'?'<span class="bm">Karl</span>':'<span class="bf">Kona</span>';}
function ft(t){return(t||'').replace('1 day, ','1d ').replace('2 days, ','2d ').replace('1900-01-01 ','');}
function gbar(m,f,id){
  const e=document.getElementById(id);if(!e)return;
  const tot=m+f,mp=(m/tot*100).toFixed(0),fp=(f/tot*100).toFixed(0);
  e.innerHTML=`<div class="gbar"><div class="gbm" style="width:${mp}%"></div><div class="gbf" style="width:${fp}%"></div></div><div class="gleg"><span><span class="gdot" style="background:var(--bl)"></span>Karlar ${mp}% (${m.toLocaleString()})</span><span><span class="gdot" style="background:var(--rd)"></span>Konur ${fp}% (${f.toLocaleString()})</span></div>`;
}
function ptab(show,hide,btn){
  document.getElementById(show).classList.add('active');
  document.getElementById(hide).classList.remove('active');
  btn.closest('.card').querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}
function t20(arr,by){
  const isL=by==='best_laps';
  return`<table class="tbl"><thead><tr><th></th><th>Nafn</th><th>${isL?'Best laps':'Heildar KM'}</th><th>${isL?'Heildar KM':'Best laps'}</th><th>Keppnir</th><th>Hraðast</th></tr></thead><tbody>${arr.map((p,i)=>`<tr><td>${rb(i)}</td><td><div class="nm">${p.name}</div><div class="sub">${p.best_race}</div></td><td class="vlg cbl">${isL?p.best_laps:p.total_km.toLocaleString()}</td><td class="sub">${isL?p.total_km.toLocaleString():p.best_laps}</td><td class="sub">${p.n_races}</td><td class="sub">${p.fastest}</td></tr>`).join('')}</tbody></table>`;
}

  <div class="card"><div class="ct">Hringir sigurvegara á hlaup</div><div class="cw h260"><canvas id="ch-wlaps"></canvas></div></div>
  <div class="g2">
    <div class="card">
      <div class="ct">Top 20 Karlar</div>
      <div class="ptabs"><button class="ptab active" onclick="ptab('ml','mk',this)">Flest laps</button><button class="ptab" onclick="ptab('mk','ml',this)">Heildar KM</button></div>
      <div id="ml" class="ptp active">${t20(D.top20m_laps,'best_laps')}</div>
      <div id="mk" class="ptp">${t20(D.top20m_km,'total_km')}</div>
    </div>
    <div class="card">
      <div class="ct">Top 20 Konur</div>
      <div class="ptabs"><button class="ptab active" onclick="ptab('fl','fk',this)">Flest laps</button><button class="ptab" onclick="ptab('fk','fl',this)">Heildar KM</button></div>
      <div id="fl" class="ptp active">${t20(D.top20f_laps,'best_laps')}</div>
      <div id="fk" class="ptp">${t20(D.top20f_km,'total_km')}</div>
    </div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Kyn hlutfall heildar KM</div><div id="ov-gb"></div><div class="g2" style="margin-top:12px;margin-bottom:0"><div><div class="sv cbl">${ov.males_km.toLocaleString()} km</div><div class="sl">Karlar</div></div><div><div class="sv crd">${ov.females_km.toLocaleString()} km</div><div class="sl">Konur</div></div></div></div>
    <div class="card"><div class="ct">KM hlutfall</div><div class="cw h180"><canvas id="ch-kmd"></canvas></div></div>
  </div>
</div>
<div id="race-panels"></div>`;

  mkC('ch-p','bar',{labels:rL,datasets:[{data:D.races.map(r=>r.participants),backgroundColor:D.races.map(r=>r.season==='Maí'?'rgba(249,115,22,.7)':'rgba(88,166,255,.7)'),borderRadius:4}]},{plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:10},generateLabels:()=>[{text:'Maí',fillStyle:'rgba(249,115,22,.7)'},{text:'September',fillStyle:'rgba(88,166,255,.7)'}]}}}});
  mkC('ch-al','line',{labels:rL,datasets:[{data:D.races.map(r=>r.avg_laps),borderColor:CG.gr,backgroundColor:'rgba(63,185,80,.08)',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:CG.gr}]});
  mkC('ch-km','bar',{labels:rL,datasets:[{data:D.races.map(r=>r.total_km),backgroundColor:'rgba(227,179,65,.65)',borderRadius:4}]});
  mkC('ch-gt','line',{labels:rL,datasets:[{label:'Karlar %',data:D.races.map(r=>+(r.males/r.participants*100).toFixed(1)),borderColor:CG.bl,tension:.4,pointRadius:3},{label:'Konur %',data:D.races.map(r=>+(r.females/r.participants*100).toFixed(1)),borderColor:CG.rd,tension:.4,pointRadius:3}]},{plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:10}}}}});
  mkC('ch-avgkm','bar',{labels:rL,datasets:[{label:'Karlar',data:D.avg_km_data.map(r=>r.males),backgroundColor:'rgba(88,166,255,.75)',borderRadius:3},{label:'Konur',data:D.avg_km_data.map(r=>r.females),backgroundColor:'rgba(248,81,73,.75)',borderRadius:3}]},{plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:10}}}}});
  mkC('ch-age','line',{labels:rL,datasets:[{data:D.races.map(r=>r.avg_age),borderColor:CG.pu,backgroundColor:'rgba(163,113,247,.08)',fill:true,tension:.4,pointRadius:5,pointBackgroundColor:CG.pu}]},{scales:{y:{min:35,max:45,grid:{color:CG.grid},ticks:{color:CG.tx,font:{size:10}}},x:{grid:{color:CG.grid},ticks:{color:CG.tx,font:{size:10}}}}});
  mkDonut('ch-kmd',ov.males_km,ov.females_km);
  mkC('ch-wlaps','bar',{labels:D.races.map(r=>r.race),datasets:[{data:D.races.map(r=>r.winner.laps),backgroundColor:D.races.map(r=>r.season==='Maí'?'rgba(249,115,22,.8)':'rgba(88,166,255,.8)'),borderRadius:5,label:'Laps'}]},{plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:10},generateLabels:()=>[{text:'Maí',fillStyle:'rgba(249,115,22,.8)'},{text:'September',fillStyle:'rgba(88,166,255,.8)'}]}}},tooltip:{callbacks:{label:ctx=>{const r=D.races[ctx.dataIndex];return` ${r.winner.name} – ${ctx.raw} laps`;}}}});
  gbar(ov.males_km,ov.females_km,'ov-gb');

  D.races.forEach((r,ri)=>buildRace(r,ri));
}

function buildRace(r,ri){
  const pid=`r${ri}`, isMai=r.season==='Maí';
  const ac=isMai?'var(--or)':'var(--bl)';
  const acHex=isMai?CG.or:CG.bl;
  const w=r.winner, ru=r.runner_up;

  function rows5(arr){return arr.map((p,i)=>`<tr><td>${rb(i)}</td><td><div class="nm">${p.name}</div><div class="sub">${p.fastest} (H.${p.fastest_lap})</div></td><td class="vlg" style="color:${ac}">${p.laps}</td><td class="sub">${p.km.toFixed(1)} km</td><td class="sub">${ft(p.race_time)}</td></tr>`).join('');}
  function rows15(){return r.top15.map((p,i)=>`<tr><td>${rb(i)}</td><td>${gb(p.gender)}</td><td><div class="nm">${p.name}</div></td><td class="vlg" style="color:${ac}">${p.laps}</td><td class="sub">${p.km.toFixed(1)}</td><td class="sub">${p.fastest}</td><td class="sub">${ft(p.race_time)}</td></tr>`).join('');}

  const html=`<div id="panel-${pid}" class="panel">
  <div class="hero"><div class="htitle" style="color:${ac}">${r.race.charAt(0).toUpperCase()+r.race.slice(1)}</div><div class="hsub">${r.participants} þátttakendur · ${r.total_km.toLocaleString()} km hlaupið · ${r.season}</div></div>
  <div class="g2" style="margin-bottom:var(--gap)">
    <div class="wcard gold"><div class="wicon">🥇</div><div><div class="wlbl gold">Sigurvegari</div><div class="wnm">${w.name}</div><div class="wsub">${w.fastest} hraðastur (H.${w.fastest_lap}) · ${ft(w.race_time)}</div></div><div class="wlaps"><div class="wnum gold">${w.laps}</div><div class="wunit">laps</div></div></div>
    <div class="wcard silver"><div class="wicon">🥈</div><div><div class="wlbl silver">2. sæti</div><div class="wnm">${ru.name}</div><div class="wsub">${ru.fastest} hraðastur (H.${ru.fastest_lap}) · ${ft(ru.race_time)}</div></div><div class="wlaps"><div class="wnum silver">${ru.laps}</div><div class="wunit">laps</div></div></div>
  </div>
  <div class="sg">
    <div class="sb"><div class="sv cbl">${r.participants}</div><div class="sl">Þátttakendur</div></div>
    <div class="sb"><div class="sv" style="color:${ac}">${r.avg_laps}</div><div class="sl">Meðal laps</div></div>
    <div class="sb"><div class="sv cgd">${r.max_laps}</div><div class="sl">Hámarks laps</div></div>
    <div class="sb"><div class="sv cgr">${r.total_km.toLocaleString()}</div><div class="sl">Heildar KM</div></div>
    <div class="sb"><div class="sv">${r.avg_km}</div><div class="sl">KM/þátttakandi</div></div>
    <div class="sb"><div class="sv">${r.avg_fastest}</div><div class="sl">Meðal hraðasti hringur</div></div>
    <div class="sb"><div class="sv cpu">${r.avg_age||'-'}</div><div class="sl">Meðalaldur</div></div>
    <div class="sb"><div class="sv cor">${r.avg_lap||'-'}</div><div class="sl">Meðal hringtími</div></div>
    <div class="sb"><div class="sv cbl">${r.avg_km_males}</div><div class="sl">Meðal KM/karl</div></div>
    <div class="sb"><div class="sv crd">${r.avg_km_females}</div><div class="sl">Meðal KM/kona</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Kyn hlutfall</div><div id="gb-${pid}"></div><div style="display:flex;gap:24px;margin-top:12px"><div><div class="sv cbl">${r.males}</div><div class="sl">Karlar</div></div><div><div class="sv crd">${r.females}</div><div class="sl">Konur</div></div></div><div style="margin-top:10px;font-size:11px;color:var(--dm)">Karlar KM: <b style="color:var(--bl)">${r.males_km.toLocaleString()}</b> · Konur KM: <b style="color:var(--rd)">${r.females_km.toLocaleString()}</b></div></div>
    <div class="card"><div class="ct">KM hlutfall eftir kyni</div><div class="cw h180"><canvas id="ch-gd-${pid}"></canvas></div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">🔵 Top 5 Karlar</div><table class="tbl"><thead><tr><th></th><th>Nafn</th><th>Laps</th><th>KM</th><th>Tími</th></tr></thead><tbody>${rows5(r.top5_males)}</tbody></table></div>
    <div class="card"><div class="ct">🔴 Top 5 Konur</div><table class="tbl"><thead><tr><th></th><th>Nafn</th><th>Laps</th><th>KM</th><th>Tími</th></tr></thead><tbody>${rows5(r.top5_females)}</tbody></table></div>
  </div>
  <div class="card"><div class="ct">Top 15 Keppendur</div><table class="tbl"><thead><tr><th></th><th>Kyn</th><th>Nafn</th><th>Laps</th><th>KM</th><th>Hraðastur</th><th>Tími</th></tr></thead><tbody>${rows15()}</tbody></table></div>
</div>`;
  document.getElementById('race-panels').insertAdjacentHTML('beforeend',html);
  gbar(r.males,r.females,`gb-${pid}`);
}

function nav(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
  const ri=parseInt(id.replace('r',''));
  if(!isNaN(ri)){
    const r=D.races[ri];
    setTimeout(()=>mkDonut(`ch-gd-r${ri}`,r.males_km,r.females_km),30);
  }
}

buildOverall();
</script></body></html>
