<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bakgarðshlaupið – Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{--bg:#0d1117;--surface:#161b22;--card:#1f2937;--border:rgba(255,255,255,0.07);--text:#e6edf3;--dim:#8b949e;--blue:#58a6ff;--green:#3fb950;--orange:#f97316;--red:#f85149;--gold:#e3b341;--purple:#a371f7;--radius:10px;--gap:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100%}
.sidenav{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;z-index:200;padding:0 0 24px 0}
.nav-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.nav-logo h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.nav-logo p{font-size:11px;color:var(--dim);margin-top:2px}
.nav-section{padding:10px 12px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:transparent;color:var(--dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;text-align:left;transition:all .12s}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.nav-btn.active{background:rgba(88,166,255,0.12);color:var(--blue)}
.nav-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.nav-btn.active .dot{background:var(--blue)}
.season{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto}
.mai{background:rgba(249,115,22,.15);color:var(--orange)}
.sept{background:rgba(88,166,255,.15);color:var(--blue)}
.main{margin-left:220px;padding:24px;min-height:100vh}
.panel{display:none}.panel.active{display:block}
.hero{margin-bottom:24px}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1.1;margin-bottom:4px}
.hero-sub{color:var(--dim);font-size:13px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:16px 0 24px}
.stat-box{background:var(--surface);padding:14px 16px}
.stat-val{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1;margin-bottom:2px}
.stat-lbl{font-size:11px;color:var(--dim)}
.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-gold{color:var(--gold)}.c-orange{color:var(--orange)}.c-red{color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:var(--gap)}
.card-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.chart-wrap{position:relative}.h200{height:200px}.h260{height:260px}.h300{height:300px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,0.02)}
.rank-badge{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.r1{background:#FFD700;color:#000}.r2{background:#C0C0C0;color:#000}.r3{background:#CD7F32;color:#fff}.rn{background:var(--border);color:var(--dim)}
.badge-m{background:rgba(88,166,255,.15);color:var(--blue);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.badge-f{background:rgba(248,81,73,.15);color:var(--red);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.name{font-weight:500;color:var(--text)}.sub{font-size:11px;color:var(--dim)}
.val-lg{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.gbar-wrap{margin:8px 0}
.gbar{height:10px;border-radius:5px;display:flex;overflow:hidden}
.gbar-m{background:var(--blue)}.gbar-f{background:var(--red)}
.gbar-legend{display:flex;gap:16px;margin-top:6px}
.gbar-leg{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.gbar-dot{width:8px;height:8px;border-radius:50%}
.winner-card{background:linear-gradient(135deg,rgba(227,179,65,.08),rgba(227,179,65,.02));border:1px solid rgba(227,179,65,.2);border-radius:var(--radius);padding:14px 18px;margin-bottom:var(--gap);display:flex;align-items:center;gap:16px}
.winner-icon{font-size:28px}
.wlabel{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wname{font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif}
.wsub{font-size:12px;color:var(--dim);margin-top:1px}
.winner-laps{margin-left:auto;text-align:right}
.wnum{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:var(--gold);line-height:1}
.wunit{font-size:12px;color:var(--dim)}
.ptabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.ptab{padding:8px 16px;border:none;background:transparent;color:var(--dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.active{color:var(--blue);border-bottom-color:var(--blue)}
.ptab-panel{display:none}.ptab-panel.active{display:block}
@media(max-width:768px){.sidenav{width:100%;position:relative}.main{margin-left:0}.g2,.g3{grid-template-columns:1fr}}
</style>
</head>

const chartCache = {};

function rb(i) {
  if(i===0) return '<span class="rank-badge r1">1</span>';
  if(i===1) return '<span class="rank-badge r2">2</span>';
  if(i===2) return '<span class="rank-badge r3">3</span>';
  return `<span class="rank-badge rn">${i+1}</span>`;
}
function gb(g) { return g==='M'?'<span class="badge-m">Karl</span>':'<span class="badge-f">Kona</span>'; }
function fmtTime(t) { return t.replace('1 day, ','1d ').replace('2 days, ','2d ').replace('1900-01-01 ',''); }

function gBar(m,f,el) {
  const tot=m+f, mp=(m/tot*100).toFixed(0), fp=(f/tot*100).toFixed(0);
  const e=document.getElementById(el);
  if(e) e.innerHTML=`<div class="gbar"><div class="gbar-m" style="width:${mp}%"></div><div class="gbar-f" style="width:${fp}%"></div></div><div class="gbar-legend"><div class="gbar-leg"><div class="gbar-dot" style="background:var(--blue)"></div>Karlar ${mp}% (${m})</div><div class="gbar-leg"><div class="gbar-dot" style="background:var(--red)"></div>Konur ${fp}% (${f})</div></div>`;
}

function mkChart(id,type,data,extra={}) {
  const c=document.getElementById(id);
  if(!c||chartCache[id]) return;
  chartCache[id]=new Chart(c,{type,data,options:{...JSON.parse(JSON.stringify(CO)),...extra}});
}

function mkDonut(id,m,f) {
  const c=document.getElementById(id);
  if(!c||chartCache[id]) return;
  chartCache[id]=new Chart(c,{type:'doughnut',data:{labels:['Karlar','Konur'],datasets:[{data:[m,f],backgroundColor:[CG.blue,CG.red],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:true,position:'right',labels:{color:'#8b949e',font:{size:11},padding:12}},tooltip:{backgroundColor:'#1f2937',titleColor:'#e6edf3',bodyColor:'#8b949e'}}}});
}

  // Avg KM comparison chart
  mkChart('ch-avgkm','bar',{labels:D.races.map(r=>r.race),datasets:[
    {label:'Karlar',data:AVG.per_race.map(r=>r.avg_km_males),backgroundColor:'rgba(88,166,255,.75)',borderRadius:3},
    {label:'Konur',data:AVG.per_race.map(r=>r.avg_km_females),backgroundColor:'rgba(248,81,73,.75)',borderRadius:3}
  ]},{plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:10}}}}});
  gBar(ov.males_km,ov.females_km,'ov-gbar');

  D.races.forEach((r,i)=>buildRacePanel(r,i));
}

function buildTop20tbl(arr,sortBy) {
  const s=[...arr].sort((a,b)=>b[sortBy]-a[sortBy]);
  const isLaps=sortBy==='best_laps';
  return `<table class="tbl"><thead><tr><th></th><th>Nafn</th><th>${isLaps?'Best laps':'Heildar KM'}</th><th>${isLaps?'Heildar KM':'Best laps'}</th><th>Keppnir</th><th>Hraðast</th></tr></thead><tbody>
    ${s.map((p,i)=>`<tr><td>${rb(i)}</td><td><div class="name">${p.name}</div><div class="sub">${p.best_race}</div></td><td class="val-lg c-blue">${isLaps?p.best_laps:p.total_km.toLocaleString()}</td><td class="sub">${isLaps?p.total_km.toLocaleString():p.best_laps}</td><td class="sub">${p.n_races}</td><td class="sub">${p.fastest}</td></tr>`).join('')}
  </tbody></table>`;
}

function buildRacePanel(r,ri) {
  const pid=`r${ri}`;
  const isMai=r.season==='Maí';
  const ac=isMai?'var(--orange)':'var(--blue)';
  const winner=r.top15[0];

  function rows5(arr) {
    return arr.map((p,i)=>`<tr><td>${rb(i)}</td><td><div class="name">${p.name}</div><div class="sub">${p.fastest} (H.${p.fastest_lap})</div></td><td class="val-lg" style="color:${ac}">${p.laps}</td><td class="sub">${p.km.toFixed(1)} km</td><td class="sub">${fmtTime(p.race_time)}</td></tr>`).join('');
  }
  function rows15() {
    return r.top15.map((p,i)=>`<tr><td>${rb(i)}</td><td>${gb(p.gender)}</td><td><div class="name">${p.name}</div></td><td class="val-lg" style="color:${ac}">${p.laps}</td><td class="sub">${p.km.toFixed(1)}</td><td class="sub">${p.fastest}</td><td class="sub">${fmtTime(p.race_time)}</td></tr>`).join('');
  }

  const html=`<div id="panel-${pid}" class="panel">
    <div class="hero">
      <div class="hero-title" style="color:${ac}">${r.race.charAt(0).toUpperCase()+r.race.slice(1)}</div>
      <div class="hero-sub">${r.participants} þátttakendur · ${r.total_km.toLocaleString()} km hlaupið</div>
    </div>
    <div class="winner-card">
      <div class="winner-icon">🏆</div>
      <div><div class="wlabel">Sigurvegari</div><div class="wname">${winner.name}</div><div class="wsub">${winner.fastest} hraðastur (H.${winner.fastest_lap}) · ${fmtTime(winner.race_time)}</div></div>
      <div class="winner-laps"><div class="wnum">${winner.laps}</div><div class="wunit">laps</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val c-blue">${r.participants}</div><div class="stat-lbl">Þátttakendur</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${ac}">${r.avg_laps}</div><div class="stat-lbl">Meðal laps</div></div>
      <div class="stat-box"><div class="stat-val c-gold">${r.max_laps}</div><div class="stat-lbl">Hámarks laps</div></div>
      <div class="stat-box"><div class="stat-val c-green">${r.total_km.toLocaleString()}</div><div class="stat-lbl">Heildar KM</div></div>
      <div class="stat-box"><div class="stat-val">${r.avg_km}</div><div class="stat-lbl">KM/þátttakandi</div></div>
      <div class="stat-box"><div class="stat-val">${r.avg_fastest}</div><div class="stat-lbl">Meðal hraðasti hringur</div></div>
    </div>
    <div class="stat-grid" style="margin-top:0;margin-bottom:var(--gap)">
      <div class="stat-box"><div class="stat-val c-blue">${AVG.per_race[ri].avg_km_males}</div><div class="stat-lbl">Meðal KM – Karlar</div></div>
      <div class="stat-box"><div class="stat-val c-red">${AVG.per_race[ri].avg_km_females}</div><div class="stat-lbl">Meðal KM – Konur</div></div>
      <div class="stat-box"><div class="stat-val c-green">${AVG.per_race[ri].avg_km_total}</div><div class="stat-lbl">Meðal KM – Heild</div></div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-title">Kyn hlutfall</div><div id="gb-${pid}"></div><div style="margin-top:12px;display:flex;gap:24px"><div><div class="stat-val c-blue">${r.males}</div><div class="stat-lbl">Karlar</div></div><div><div class="stat-val c-red">${r.females}</div><div class="stat-lbl">Konur</div></div></div><div style="margin-top:10px;font-size:11px;color:var(--dim)">Karlar KM: <b style="color:var(--blue)">${r.males_km.toLocaleString()}</b> · Konur KM: <b style="color:var(--red)">${r.females_km.toLocaleString()}</b></div></div>
      <div class="card"><div class="card-title">KM hlutfall eftir kyni</div><div class="chart-wrap h200"><canvas id="ch-gd-${pid}"></canvas></div></div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-title">🔵 Top 5 Karlar</div><table class="tbl"><thead><tr><th></th><th>Nafn</th><th>Laps</th><th>KM</th><th>Tími</th></tr></thead><tbody>${rows5(r.top5_males)}</tbody></table></div>
      <div class="card"><div class="card-title">🔴 Top 5 Konur</div><table class="tbl"><thead><tr><th></th><th>Nafn</th><th>Laps</th><th>KM</th><th>Tími</th></tr></thead><tbody>${rows5(r.top5_females)}</tbody></table></div>
    </div>
    <div class="card"><div class="card-title">Top 15 Keppendur</div><table class="tbl"><thead><tr><th></th><th>Kyn</th><th>Nafn</th><th>Laps</th><th>KM</th><th>Hraðastur</th><th>Tími</th></tr></thead><tbody>${rows15()}</tbody></table></div>
  </div>`;
  document.getElementById('race-panels').insertAdjacentHTML('beforeend',html);
  gBar(r.males,r.females,`gb-${pid}`);
}

function show(id,btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
  // lazy init race charts
  const ri=parseInt(id.replace('r',''));
  if(!isNaN(ri)) {
    const r=D.races[ri];
    const pid=`r${ri}`;
    setTimeout(()=>mkDonut(`ch-gd-${pid}`,r.males_km,r.females_km),50);
  }
}

function ptab(show,hide,btn) {
  document.getElementById(show).classList.add('active');
  document.getElementById(hide).classList.remove('active');
  btn.closest('.card').querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

buildOverall();
</script></body></html>
